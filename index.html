<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎖️ Army Rush</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{background:#111;overflow:hidden;width:100vw;height:100vh;touch-action:none;user-select:none;font-family:'Arial Black',Arial,sans-serif;}
    canvas{display:block;}
    #hud{position:fixed;top:0;left:0;right:0;pointer-events:none;display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;background:linear-gradient(rgba(0,0,0,.75),transparent);z-index:10;}
    .hud-pill{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:5px 14px;color:#fff;font:700 13px 'Arial Black',Arial,sans-serif;}
    #wave-bar-wrap{position:fixed;top:50px;left:50%;transform:translateX(-50%);width:min(300px,75vw);pointer-events:none;z-index:10;text-align:center;}
    #wave-label{color:#f1c40f;font:700 10px 'Arial Black';margin-bottom:3px;text-shadow:1px 1px 2px #000;}
    #wave-bg{height:7px;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden;border:1px solid rgba(255,215,0,.25);}
    #wave-fill{height:100%;background:linear-gradient(90deg,#f1c40f,#ff6f00);border-radius:4px;width:0%;transition:width .25s;}
    #squad-hud{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font:900 40px 'Arial Black';color:#fff;text-shadow:0 0 18px rgba(33,150,243,.9),3px 3px 0 #000;pointer-events:none;z-index:10;}
    #toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#f39c12,#c0392b);color:#fff;font:900 14px 'Arial Black';padding:7px 20px;border-radius:30px;box-shadow:0 4px 20px rgba(192,57,43,.6);pointer-events:none;z-index:20;opacity:0;transition:opacity .3s;white-space:nowrap;}
    #toast.show{opacity:1;}
    /* Weapon buttons */
    #wbtns{position:fixed;right:10px;bottom:68px;display:flex;flex-direction:column;gap:8px;z-index:20;}
    .wbtn{width:54px;height:54px;border-radius:13px;border:2px solid rgba(255,255,255,.22);background:rgba(0,0,0,.72);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;}
    .wbtn.active{border-color:#ffd700;box-shadow:0 0 14px rgba(255,215,0,.55);}
    .wbtn-icon{font-size:22px;line-height:1;}
    .wbtn-sub{font-size:9px;font-weight:900;margin-top:2px;}
    /* Overlay */
    #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:100;}
    #overlay h1{font-size:clamp(2rem,9vw,3.5rem);color:#fff;margin-bottom:10px;text-align:center;}
    #overlay .sub{font-size:clamp(.82rem,3vw,.98rem);color:#bbb;margin-bottom:26px;text-align:center;line-height:2.1;}
    #overlay button{background:linear-gradient(135deg,#f39c12,#c0392b);border:none;color:#fff;font:900 1.25rem 'Arial Black';cursor:pointer;padding:13px 46px;border-radius:50px;box-shadow:0 8px 24px rgba(192,57,43,.5);}
    #score-final{color:#f1c40f;font-size:1.1rem;margin-bottom:20px;}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hud-pill" id="score-box">💰 0</div>
  <div class="hud-pill" id="wave-box">Wave 1/5</div>
  <div class="hud-pill" id="wpn-box">🔫 弾丸 Lv1</div>
</div>
<div id="wave-bar-wrap">
  <div id="wave-label">WAVE進行度</div>
  <div id="wave-bg"><div id="wave-fill"></div></div>
</div>
<div id="squad-hud">×10</div>
<div id="toast"></div>
<div id="wbtns">
  <div class="wbtn active" id="wbtn-gun"   data-t="gun">  <div class="wbtn-icon">🔫</div><div class="wbtn-sub" style="color:#ffd700">Lv1</div></div>
  <div class="wbtn"        id="wbtn-laser" data-t="laser"><div class="wbtn-icon">⚡</div><div class="wbtn-sub" style="color:#ff6b6b">-1Lv</div></div>
  <div class="wbtn"        id="wbtn-flame" data-t="flame"><div class="wbtn-icon">🔥</div><div class="wbtn-sub" style="color:#ff6b6b">-1Lv</div></div>
</div>
<div id="overlay">
  <h1>🎖️ Army Rush</h1>
  <div class="sub">
    タッチ/ドラッグで左右移動<br>
    <b style="color:#ffd700">右の武器ボタンで武器切替（Lv-1）</b><br>
    ゲートを通り仲間を増やせ！弾でゲートを撃つと数値UP！<br>
    各Waveのボスを倒せ！ボス戦中も敵が来るぞ！
  </div>
  <button id="start-btn">▶ スタート</button>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,RL,RR,RW; // Road Left/Right/Width

// ── WEAPON CONFIG ──────────────────────────────────────────────────────
// Gun: projectile bullets  count=bullets per volley
const GUN=[null,
  {rate:20,dmg:4, count:1, spread:0 },
  {rate:17,dmg:5, count:3, spread:18},
  {rate:14,dmg:7, count:5, spread:30},
  {rate:10,dmg:9, count:9, spread:46},
  {rate:5, dmg:14,count:15,spread:65}, // Lv5: 超爽快
];
// Laser: instant beam damage
const LASER=[null,
  {rate:28,dmg:12, width:7 },
  {rate:22,dmg:25, width:16},
  {rate:16,dmg:42, width:28},
  {rate:10,dmg:65, width:45},
  {rate:5, dmg:160,width:9999}, // Lv5: full road beam
];
// Flame: continuous cone damage per frame + visual particles
const FLAME=[null,
  {dps:.18,ang:22,range:130,ppf:2, ps:9, pl:18},
  {dps:.30,ang:34,range:190,ppf:4, ps:13,pl:20},
  {dps:.46,ang:48,range:260,ppf:7, ps:17,pl:22},
  {dps:.65,ang:64,range:350,ppf:13,ps:22,pl:24},
  {dps:1.0,ang:90,range:460,ppf:22,ps:30,pl:26}, // Lv5: 地獄の業火
];
const WINFO={
  gun:  {icon:'🔫',name:'弾丸',   col:'#ffd700'},
  laser:{icon:'⚡',name:'レーザー',col:'#00e5ff'},
  flame:{icon:'🔥',name:'火炎放射',col:'#ff6600'},
};
const BOSS_HP=[0,220,380,580,800,1200]; // wave 1-5

let G=null;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  RW=Math.min(360,W*.80); RL=(W-RW)/2; RR=RL+RW;
  if(G) G.sqY=H*.82;
}
function newGame(){
  G={
    state:'play',soldiers:10,score:0,wave:1,
    WAVE_DIST:5000,scrolled:0,waveProgress:0,
    bossPhase:false,bossSpawned:false,
    sqX:W/2,sqTargetX:W/2,sqY:H*.82,
    wType:'gun',wLv:1,fireCD:0,
    enemies:[],bullets:[],gates:[],items:[],particles:[],laserBeams:[],
    boss:null,shakeTimer:0,
    nextEnemy:80,nextGate:200,nextItem:720,
    killCombo:0,comboTimer:0,
    dragging:false,dragX:0,
  };
  refreshWBtns();
}

// ── INPUT ──────────────────────────────────────────────────────────────
canvas.addEventListener('pointerdown',e=>{
  if(!G||G.state!=='play')return;
  G.dragging=true;G.dragX=e.clientX;
  canvas.setPointerCapture(e.pointerId);
},{passive:false});
canvas.addEventListener('pointermove',e=>{
  if(!G||!G.dragging)return;
  G.sqTargetX+=e.clientX-G.dragX;
  G.sqTargetX=Math.max(RL+40,Math.min(RR-40,G.sqTargetX));
  G.dragX=e.clientX;
},{passive:false});
canvas.addEventListener('pointerup',()=>G&&(G.dragging=false));
canvas.addEventListener('pointercancel',()=>G&&(G.dragging=false));
window.addEventListener('keydown',e=>{
  if(!G||G.state!=='play')return;
  if(e.key==='ArrowLeft')  G.sqTargetX=Math.max(RL+40,G.sqTargetX-22);
  if(e.key==='ArrowRight') G.sqTargetX=Math.min(RR-40,G.sqTargetX+22);
  if(e.key==='1') switchW('gun');
  if(e.key==='2') switchW('laser');
  if(e.key==='3') switchW('flame');
});
window.addEventListener('resize',resize);

document.querySelectorAll('.wbtn').forEach(b=>{
  b.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    if(!G||G.state!=='play')return;
    switchW(b.dataset.t);
  });
});

// ── WEAPON SWITCH ────────────────────────────────────────────────────────
function switchW(t){
  if(!G||t===G.wType)return;
  G.wType=t; G.wLv=Math.max(1,G.wLv-1);
  G.bullets=[]; G.laserBeams=[];
  toast(WINFO[t].icon+' '+WINFO[t].name+' Lv'+G.wLv+' (Lv-1)');
  refreshWBtns();
}
function refreshWBtns(){
  ['gun','laser','flame'].forEach(t=>{
    const b=document.getElementById('wbtn-'+t);
    const act=G&&G.wType===t;
    b.classList.toggle('active',act);
    b.querySelector('.wbtn-sub').textContent=act?'Lv'+G.wLv:'-1Lv';
    b.querySelector('.wbtn-sub').style.color=act?'#ffd700':'#ff6b6b';
  });
  if(G){
    const w=WINFO[G.wType];
    document.getElementById('wpn-box').textContent=w.icon+' '+w.name+' Lv'+G.wLv;
  }
}

// ── HELPERS ────────────────────────────────────────────────────────────
const rnd=(lo,hi)=>lo+Math.random()*(hi-lo);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function pt(x,y,col,n=10,spd=4,sz=[2,6]){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=spd*(.5+Math.random());
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:35+Math.random()*25,maxLife:60,col,
      size:sz[0]+Math.random()*(sz[1]-sz[0]),isT:false,flame:false});
  }
}
function tx(x,y,text,col,sz=22){
  G.particles.push({x,y,vx:rnd(-.5,.5),vy:-2.6,life:60,maxLife:60,col,text,sz,isT:true});
}
let _tt=null;
function toast(msg,dur=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),dur);
}
function hud(){
  document.getElementById('score-box').textContent='💰 '+G.score;
  document.getElementById('wave-box').textContent='Wave '+G.wave+'/5';
  document.getElementById('squad-hud').textContent='×'+G.soldiers;
  document.getElementById('wave-fill').style.width=Math.min(100,G.waveProgress*100)+'%';
  refreshWBtns();
}

// ── SPAWN ─────────────────────────────────────────────────────────────
function spawnRow(extra=0){
  const count=2+Math.floor(G.wave*.9)+Math.floor(Math.random()*2)+extra;
  const sp=RW/(count+1);
  for(let i=1;i<=count;i++){
    const hp=2+Math.floor(G.wave*1.3);
    G.enemies.push({x:RL+sp*i+rnd(-10,10),y:-32,hp,maxHp:hp,
      spd:rnd(1.1,1.8)+G.wave*.1,hitCD:0,size:18});
  }
}
function spawnGate(){
  const pv=Math.floor(rnd(6,32)),nv=-Math.floor(rnd(4,18));
  const both=Math.random()<.18,gw=68,gh=44,cx=W/2,gap=RW*.26;
  G.gates.push({x:cx-gap,y:-60,w:gw,h:gh,value:both?Math.floor(rnd(1,8)):nv,spd:2.0,passed:false});
  G.gates.push({x:cx+gap,y:-60,w:gw,h:gh,value:pv,spd:2.0,passed:false});
}
function spawnBoss(){
  G.boss={x:W/2,y:-160,targetY:Math.min(H*.22,175),
    hp:BOSS_HP[G.wave],maxHp:BOSS_HP[G.wave],
    hitCD:0,attackCD:75,size:70,dir:1,arrived:false};
  G.bossPhase=true;
  // ★ 敵は消さない！ボス戦中も湧き続ける
}
function spawnRoadItem(){
  const isW=G.wLv<5&&Math.random()<.52;
  G.items.push({x:rnd(RL+50,RR-50),y:-50,type:isW?'wup':'sol',pulse:0,life:440,spd:1.7});
}
function dropItem(x,y){
  const isW=G.wLv<5;
  G.items.push({x,y,type:isW?'wup':'sol',pulse:0,life:350,spd:0});
}

// ── FIRE ──────────────────────────────────────────────────────────────
function fireGun(){
  const c=GUN[G.wLv],sp=c.spread*Math.PI/180;
  for(let i=0;i<c.count;i++){
    const a=c.count===1?-Math.PI/2:-Math.PI/2+(i/(c.count-1)-.5)*sp;
    G.bullets.push({x:G.sqX+rnd(-10,10),y:G.sqY-32,
      vx:Math.cos(a)*13,vy:Math.sin(a)*13,dmg:c.dmg,life:80});
  }
  if(G.wLv===5) pt(G.sqX,G.sqY-32,'#ffd700',5,6,[2,5]);
}

function fireLaser(){
  const c=LASER[G.wLv];
  const bw=Math.min(c.width,RW);
  const bx=clamp(G.sqX-bw/2,RL,RR-bw)+bw/2;
  G.laserBeams.push({cx:bx,width:bw,life:8+G.wLv*2,maxLife:8+G.wLv*2,lv:G.wLv});
  if(G.wLv===5) G.laserBeams.push({cx:W/2,width:W,life:3,maxLife:3,flash:true});
  // instant damage
  G.enemies=G.enemies.filter(e=>{
    if(e.x>bx-bw/2-e.size&&e.x<bx+bw/2+e.size){
      e.hp-=c.dmg;e.hitCD=8;
      if(e.hp<=0){
        killEnemy(e); return false;
      }
    }
    return true;
  });
  if(G.boss&&G.boss.x>bx-bw/2-G.boss.size&&G.boss.x<bx+bw/2+G.boss.size){
    G.boss.hp-=c.dmg;G.boss.hitCD=6;
    pt(G.boss.x,G.boss.y,'#00e5ff',4,3);
  }
}

function applyFlame(){
  const c=FLAME[G.wLv],cr=c.ang*Math.PI/180;
  // Damage cone
  G.enemies=G.enemies.filter(e=>{
    const dx=e.x-G.sqX,dy=e.y-G.sqY;
    const d=Math.hypot(dx,dy);
    let ad=Math.atan2(dy,dx)-(-Math.PI/2);
    while(ad>Math.PI)ad-=2*Math.PI;while(ad<-Math.PI)ad+=2*Math.PI;
    if(Math.abs(ad)<cr/2&&d<c.range){
      e.hp-=c.dps;e.hitCD=3;
      if(e.hp<=0){killEnemy(e);return false;}
    }
    return true;
  });
  if(G.boss){
    const dx=G.boss.x-G.sqX,dy=G.boss.y-G.sqY;
    const d=Math.hypot(dx,dy);
    let ad=Math.atan2(dy,dx)-(-Math.PI/2);
    while(ad>Math.PI)ad-=2*Math.PI;while(ad<-Math.PI)ad+=2*Math.PI;
    if(Math.abs(ad)<cr/2&&d<c.range){G.boss.hp-=c.dps*.6;G.boss.hitCD=3;}
  }
  // Visual particles (flame effect)
  for(let i=0;i<c.ppf;i++){
    const a=-Math.PI/2+rnd(-cr/2,cr/2),spd=rnd(2.2,5);
    const cols=['#ff1a00','#ff4500','#ff6600','#ff8c00','#ffaa00','#ffcc00'];
    G.particles.push({
      x:G.sqX+rnd(-12,12),y:G.sqY-22,
      vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:rnd(10,c.pl),maxLife:c.pl,
      col:cols[Math.floor(Math.random()*cols.length)],
      size:rnd(4,c.ps),isT:false,flame:true,
    });
  }
  // Lv5: add extra large embers
  if(G.wLv===5&&Math.random()<.4){
    const a=-Math.PI/2+rnd(-cr/2,cr/2);
    G.particles.push({x:G.sqX,y:G.sqY-26,vx:Math.cos(a)*rnd(4,8),vy:Math.sin(a)*rnd(4,8),
      life:rnd(20,32),maxLife:32,col:'#ffffff',size:rnd(6,14),isT:false,flame:true});
  }
}

function killEnemy(e){
  G.score+=10;
  G.killCombo++;G.comboTimer=80;
  pt(e.x,e.y,'#ff3d00',10,5,[3,7]);
  tx(e.x,e.y-12,'+10','#ffd700');
  if(G.wLv===5&&G.killCombo%8===0){
    const msgs=['MASSACRE!','UNSTOPPABLE!','OBLITERATE!','GODLIKE!!'];
    tx(G.sqX,G.sqY-70,msgs[Math.floor(Math.random()*msgs.length)],'#ffd700',28);
    G.shakeTimer=6;
  }
}

// ── UPDATE ────────────────────────────────────────────────────────────
function update(){
  if(!G||G.state!=='play')return;
  G.sqX+=(G.sqTargetX-G.sqX)*.16;
  G.sqX=clamp(G.sqX,RL+40,RR-40);

  // Wave progress (scrolled always increases for spawn triggers)
  G.scrolled+=3;
  if(!G.bossPhase){
    G.waveProgress=Math.min(1,G.scrolled/G.WAVE_DIST);
    if(!G.bossSpawned&&G.waveProgress>=1){G.bossSpawned=true;spawnBoss();}
  }

  // Combo timer
  if(G.comboTimer>0){G.comboTimer--;if(G.comboTimer===0)G.killCombo=0;}

  // ── Fire ──
  const hasT=G.enemies.length>0||G.bossPhase||G.gates.length>0;
  if(G.wType==='flame'){
    if(hasT) applyFlame();
  } else {
    G.fireCD--;
    const rate=G.wType==='gun'?GUN[G.wLv].rate:LASER[G.wLv].rate;
    if(G.fireCD<=0&&hasT){
      G.wType==='gun'?fireGun():fireLaser();
      G.fireCD=rate;
    }
  }

  // ── Bullets ──
  G.bullets=G.bullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.y<0)return false;
    for(let i=G.enemies.length-1;i>=0;i--){
      const e=G.enemies[i];
      if(dst(b,e)<e.size+5){
        e.hp-=b.dmg;e.hitCD=7;pt(b.x,b.y,'#ff7043',4,2);
        if(e.hp<=0){killEnemy(e);G.enemies.splice(i,1);}
        return false;
      }
    }
    if(G.boss&&dst(b,G.boss)<G.boss.size+5){
      G.boss.hp-=b.dmg;G.boss.hitCD=5;pt(b.x,b.y,'#ff7043',3,2);return false;
    }
    for(let i=0;i<G.gates.length;i++){
      const g=G.gates[i];
      if(!g.passed&&b.x>g.x-g.w/2&&b.x<g.x+g.w/2&&b.y>g.y-g.h/2&&b.y<g.y+g.h/2){
        g.value++;pt(b.x,b.y,g.value>=0?'#00e676':'#ff5252',3,2);return false;
      }
    }
    return true;
  });

  // ── Laser beams (visual only) ──
  G.laserBeams=G.laserBeams.filter(b=>{b.life--;return b.life>0;});

  // ── Enemies ──
  G.enemies=G.enemies.filter(e=>{
    e.y+=e.spd;if(e.hitCD>0)e.hitCD--;
    if(e.y>G.sqY-20){
      G.soldiers=Math.max(0,G.soldiers-1);
      tx(G.sqX+rnd(-26,26),G.sqY-42,'-1','#ff1744');
      pt(G.sqX,G.sqY-22,'#ff1744',6,3);
      G.shakeTimer=10;G.killCombo=0;
      if(G.soldiers<=0)G.state='gameover';
      return false;
    }
    return true;
  });

  // ── Gates ──
  G.gates=G.gates.filter(g=>{
    g.y+=g.spd;
    if(!g.passed&&G.sqX>g.x-g.w/2&&G.sqX<g.x+g.w/2&&G.sqY>g.y-g.h/2&&G.sqY<g.y+g.h/2){
      g.passed=true;
      G.soldiers=Math.max(1,G.soldiers+g.value);
      const c=g.value>=0?'#00e676':'#ff1744';
      pt(g.x,g.y,c,20,6);tx(g.x,g.y-28,(g.value>=0?'+':'')+g.value,c,28);
      return false;
    }
    return g.y<H+60;
  });

  // ── Items ──
  G.items=G.items.filter(item=>{
    item.pulse++;if(item.spd>0)item.y+=item.spd;item.life--;
    if(dst(item,{x:G.sqX,y:G.sqY})<52){
      if(item.type==='wup'&&G.wLv<5){
        G.wLv++;
        pt(item.x,item.y,'#ffd700',30,9);
        tx(item.x,item.y-30,'LEVEL UP！','#ffd700',26);
        toast(WINFO[G.wType].icon+' Lv'+G.wLv+(G.wLv===5?' ★MAX★':' に強化！'));
        if(G.wLv===5){pt(item.x,item.y,'#ff6600',50,12,[4,12]);G.shakeTimer=8;}
        refreshWBtns();
      }else{
        const n=10+G.wave*4;G.soldiers+=n;
        pt(item.x,item.y,'#00e676',22,7);tx(item.x,item.y-30,'+'+n+'人！','#00e676',24);
      }
      return false;
    }
    return item.life>0&&item.y<H+80;
  });

  // ── Boss ──
  if(G.boss){
    const b=G.boss;if(b.hitCD>0)b.hitCD--;
    if(!b.arrived){b.y+=2.5;if(b.y>=b.targetY)b.arrived=true;}
    else{
      b.x+=b.dir*1.8;
      if(b.x>RR-75)b.dir=-1;if(b.x<RL+75)b.dir=1;
      b.attackCD--;
      if(b.attackCD<=0){
        b.attackCD=58+Math.floor(Math.random()*38);
        const dmg=3+G.wave;
        G.soldiers=Math.max(0,G.soldiers-dmg);
        G.shakeTimer=18;G.killCombo=0;
        tx(G.sqX,G.sqY-55,'-'+dmg,'#ff1744',32);pt(G.sqX,G.sqY-30,'#ff0000',16,6);
        if(G.soldiers<=0)G.state='gameover';
      }
    }
    if(b.hp<=0){
      pt(b.x,b.y,'#ffd700',90,12,[3,12]);pt(b.x,b.y,'#ff4500',55,9);
      const bonus=500+G.wave*200;G.score+=bonus;
      tx(b.x,b.y-40,'+'+bonus,'#ffd700',32);
      dropItem(b.x,b.y+20);G.boss=null;
      if(G.wave>=5){G.state='win';return;}
      G.wave++;G.scrolled=0;G.waveProgress=0;G.bossSpawned=false;G.bossPhase=false;
      G.gates=[];G.nextEnemy=60;G.nextGate=180;G.nextItem=600;hud();
    }
  }

  // ── Spawn (always, including boss phase) ──
  // Boss phase: faster enemy spawning for chaos!
  const eInt=G.bossPhase?Math.max(55,170-G.wave*14):Math.max(110,290-G.wave*20);
  if(G.scrolled>=G.nextEnemy){
    // Boss phase: spawn more enemies at once
    spawnRow(G.bossPhase?Math.floor(G.wave/2):0);
    G.nextEnemy+=eInt+rnd(-18,18);
  }
  if(!G.bossPhase){
    if(G.scrolled>=G.nextGate){spawnGate();G.nextGate+=rnd(260,420);}
    if(G.scrolled>=G.nextItem){spawnRoadItem();G.nextItem+=rnd(480,840);}
  }

  // ── Particles ──
  G.particles=G.particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(!p.isT&&!p.flame)p.vy+=.06;
    p.life--;return p.life>0;
  });
  if(G.shakeTimer>0)G.shakeTimer--;
  hud();
}

// ── DRAW ──────────────────────────────────────────────────────────────
function draw(){
  if(!G)return;
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;
  if(G.shakeTimer>0){sx=(Math.random()-.5)*10;sy=(Math.random()-.5)*10;ctx.save();ctx.translate(sx,sy);}
  drawRoad();drawGates();drawItems();drawEnemies();
  if(G.boss)drawBoss();
  drawPlayer();
  if(G.wType==='laser')drawLaser();
  if(G.wType==='gun')  drawBullets();
  drawParticles();
  drawLv5Aura();
  if(G.shakeTimer>0)ctx.restore();
}

function drawRoad(){
  ctx.fillStyle='#2a5016';ctx.fillRect(0,0,W,H);
  // Trees (fixed)
  [0,105,210,315,420,525,630,735,840].forEach(y=>{
    dTree(RL-42,y);dTree(RR+42,y+52);
  });
  ctx.fillStyle='#455a64';ctx.fillRect(RL,0,RW,H);
  ctx.fillStyle='rgba(0,0,0,.08)';
  for(let y=0;y<H;y+=80)ctx.fillRect(RL,y,RW,40);
  ctx.fillStyle='#eceff1';ctx.fillRect(RL-8,0,8,H);ctx.fillRect(RR,0,8,H);
  ctx.save();ctx.setLineDash([36,28]);
  ctx.strokeStyle='rgba(255,255,180,.32)';ctx.lineWidth=3;
  [RL+RW/3,RL+RW*2/3].forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();});
  ctx.restore();
  if(!G.bossPhase){
    const gy=(1-G.waveProgress)*H*.5-20;
    if(gy>-20&&gy<H){
      ctx.save();ctx.strokeStyle='#ffd700';ctx.lineWidth=4;ctx.setLineDash([14,10]);
      ctx.shadowBlur=12;ctx.shadowColor='#ffd700';
      ctx.beginPath();ctx.moveTo(RL,gy);ctx.lineTo(RR,gy);ctx.stroke();
      ctx.shadowBlur=0;ctx.fillStyle='#ffd700';ctx.font='bold 11px Arial Black';ctx.textAlign='center';
      ctx.fillText('⚠️ BOSS ZONE ⚠️',W/2,gy-7);ctx.restore();
    }
  }
}

function dTree(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#4e342e';ctx.fillRect(-5,0,10,22);
  ctx.fillStyle='#2e7d32';ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(22,0);ctx.lineTo(-22,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#388e3c';ctx.beginPath();ctx.moveTo(0,-54);ctx.lineTo(17,-14);ctx.lineTo(-17,-14);ctx.closePath();ctx.fill();
  ctx.restore();
}

function dSoldier(x,y,sc=1,bc='#1565c0',hc='#0d47a1'){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,12,8,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=bc;ctx.beginPath();ctx.roundRect(-7,-7,14,20,3);ctx.fill();
  ctx.fillStyle='#1976d2';ctx.beginPath();ctx.roundRect(-4,-6,7,13,2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(-7,3,14,3);
  ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(0,-14,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=hc;ctx.beginPath();ctx.ellipse(0,-17,8,6,0,0,Math.PI);ctx.fill();ctx.fillRect(-8,-18,16,4);
  ctx.fillStyle='#333';ctx.fillRect(-3,-15,2,2);ctx.fillRect(1,-15,2,2);
  ctx.fillStyle='#546e7a';ctx.fillRect(5,-8,3,14);ctx.fillStyle='#78909c';ctx.fillRect(5,-8,6,4);
  ctx.restore();
}

function drawPlayer(){
  // Squad behind (soldiers-1 people)
  const behind=Math.min(Math.max(0,G.soldiers-1),48);
  if(behind>0){
    const cols=behind<=2?behind:behind<=6?3:behind<=12?4:behind<=22?5:behind<=35?6:8;
    const rows=Math.ceil(behind/cols),sp=18;
    for(let i=0;i<behind;i++){
      const col=i%cols,row=Math.floor(i/cols);
      dSoldier(G.sqX+(col-(cols-1)/2)*sp,G.sqY+(row+1)*sp*.82+6,.88);
    }
    if(G.soldiers-1>48){
      ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 10px Arial Black';ctx.textAlign='center';
      ctx.fillText('+'+(G.soldiers-1-48),G.sqX,G.sqY+(Math.ceil(48/8)+2)*sp*.82+6);
    }
  }
  // Front player (bigger, brighter)
  dSoldier(G.sqX,G.sqY,1.18,'#1e88e5','#0d47a1');
  // Flame nozzle visual
  if(G.wType==='flame'){
    ctx.fillStyle='#78909c';ctx.fillRect(G.sqX-3,G.sqY-40,6,16);
    ctx.fillStyle='#546e7a';ctx.fillRect(G.sqX-5,G.sqY-46,10,8);
  }
}

function drawEnemies(){
  G.enemies.forEach(e=>{
    ctx.save();ctx.translate(e.x,e.y);
    if(e.hitCD>0)ctx.filter='brightness(2.5)';
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,16,10,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#b71c1c';ctx.beginPath();ctx.roundRect(-8,-8,16,22,3);ctx.fill();
    ctx.fillStyle='#e53935';ctx.beginPath();ctx.roundRect(-5,-7,8,14,2);ctx.fill();
    ctx.fillStyle='#6d4c41';ctx.fillRect(-8,4,16,3);
    ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(0,-17,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c62828';ctx.beginPath();ctx.ellipse(0,-20,9,7,0,0,Math.PI);ctx.fill();
    ctx.fillRect(-9,-21,18,5);ctx.fillStyle='#e53935';ctx.fillRect(-9,-21,18,3);
    ctx.filter='';ctx.fillStyle='#333';ctx.fillRect(-3,-19,2,2);ctx.fillRect(2,-19,2,2);
    if(e.maxHp>1){
      const r=e.hp/e.maxHp,bw=24;
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(-bw/2,-30,bw,4);
      ctx.fillStyle=r>.5?'#4caf50':r>.25?'#ff9800':'#f44336';ctx.fillRect(-bw/2,-30,bw*r,4);
    }
    ctx.restore();
  });
}

function drawGates(){
  G.gates.forEach(g=>{
    const pos=g.value>=0;
    ctx.save();ctx.translate(g.x,g.y);
    const grd=ctx.createLinearGradient(-g.w/2,-g.h/2,g.w/2,g.h/2);
    grd.addColorStop(0,pos?'#00695c':'#b71c1c');grd.addColorStop(1,pos?'#004d40':'#7f0000');
    ctx.fillStyle=grd;ctx.beginPath();ctx.roundRect(-g.w/2,-g.h/2,g.w,g.h,22);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.roundRect(-g.w/2+4,-g.h/2+4,g.w/2,g.h*.38,14);ctx.fill();
    ctx.shadowBlur=16;ctx.shadowColor=pos?'#00e5ff':'#ff1744';
    ctx.strokeStyle=pos?'#80deea':'#ff8a80';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.roundRect(-g.w/2,-g.h/2,g.w,g.h,22);ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial Black';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=6;ctx.shadowColor='rgba(0,0,0,.6)';
    ctx.fillText((pos?'+':'')+g.value,0,0);ctx.shadowBlur=0;ctx.restore();
  });
}

function drawItems(){
  G.items.forEach(item=>{
    const wv=Math.sin(item.pulse*.1)*7;
    const c=item.type==='wup'?'#ffd700':'#00e676';
    ctx.save();ctx.translate(item.x,item.y-20+wv);
    ctx.shadowBlur=20;ctx.shadowColor=c;
    ctx.fillStyle=c+'33';ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.stroke();ctx.shadowBlur=0;
    ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(item.type==='wup'?'⬆️':'👥',0,0);ctx.restore();
    ctx.fillStyle=c;ctx.font='bold 10px Arial Black';ctx.textAlign='center';
    ctx.fillText(item.type==='wup'?'LEVEL UP!':'兵士補充！',item.x,item.y-56+wv);
  });
}

function drawBoss(){
  const b=G.boss;ctx.save();ctx.translate(b.x,b.y);
  if(b.hitCD>0)ctx.filter='brightness(3)';
  const aura=ctx.createRadialGradient(0,0,20,0,0,110);
  aura.addColorStop(0,'rgba(200,0,0,.3)');aura.addColorStop(1,'rgba(200,0,0,0)');
  ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,10,110,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,72,60,18,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a0000';ctx.beginPath();ctx.roundRect(-24,38,20,36,5);ctx.fill();ctx.beginPath();ctx.roundRect(4,38,20,36,5);ctx.fill();
  ctx.fillStyle='#6a0000';ctx.beginPath();ctx.roundRect(-70,-24,30,56,14);ctx.fill();ctx.beginPath();ctx.roundRect(40,-24,30,56,14);ctx.fill();
  ctx.fillStyle='#ef9a9a';ctx.beginPath();ctx.arc(-55,36,16,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(55,36,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8b0000';ctx.beginPath();ctx.roundRect(-44,-38,88,82,10);ctx.fill();
  ctx.fillStyle='#9b1515';ctx.beginPath();ctx.roundRect(-32,-30,50,60,8);ctx.fill();
  ctx.fillStyle='#ffb300';ctx.fillRect(-44,22,88,9);ctx.fillStyle='#ffd54f';ctx.fillRect(-7,24,14,7);
  ctx.filter='';
  ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(0,-58,36,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a0000';ctx.beginPath();ctx.ellipse(0,-66,38,26,0,0,Math.PI);ctx.fill();ctx.fillRect(-38,-78,76,16);
  ctx.fillStyle='#6a0000';ctx.fillRect(-38,-78,76,7);
  ctx.strokeStyle='#8B4513';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,-68);ctx.lineTo(6,-52);ctx.stroke();
  ctx.fillStyle='#ff0000';ctx.shadowBlur=16;ctx.shadowColor='#ff0000';
  ctx.fillRect(-18,-65,13,10);ctx.fillRect(5,-65,13,10);
  ctx.fillStyle='#ffeb3b';ctx.fillRect(-16,-63,9,7);ctx.fillRect(7,-63,9,7);ctx.shadowBlur=0;
  const bw=170,r=b.hp/b.maxHp;
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(-bw/2,-115,bw,14);
  ctx.fillStyle=r>.5?'#d32f2f':r>.25?'#f57c00':'#ff1744';ctx.fillRect(-bw/2,-115,bw*r,14);
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.5;ctx.strokeRect(-bw/2,-115,bw,14);
  ctx.fillStyle='#ffd700';ctx.font='bold 16px Arial Black';ctx.textAlign='center';
  ctx.shadowBlur=16;ctx.shadowColor='#ffd700';ctx.fillText('⚠️ BOSS ⚠️',0,-128);ctx.shadowBlur=0;
  ctx.restore();
}

function drawBullets(){
  G.bullets.forEach(b=>{
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));
    const bright=G.wLv===5;
    const grd=ctx.createLinearGradient(-14,0,4,0);
    grd.addColorStop(0,'rgba(255,230,0,0)');grd.addColorStop(1,bright?'#ffffff':'#ffe500');
    ctx.fillStyle=grd;ctx.fillRect(-14,-2,18,4);
    ctx.fillStyle=bright?'#fff':'#fff9c4';
    if(bright){ctx.shadowBlur=10;ctx.shadowColor='#fff';}
    ctx.beginPath();ctx.arc(0,0,bright?4:3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  });
}

function drawLaser(){
  G.laserBeams.forEach(beam=>{
    if(beam.flash){
      ctx.save();ctx.globalAlpha=(beam.life/beam.maxLife)*.18;
      ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore();return;
    }
    const alpha=beam.life/beam.maxLife;
    const bw=Math.min(beam.width,RW);
    const bx=clamp(beam.cx-bw/2,RL,RR-bw);
    ctx.save();
    // Outer glow
    ctx.globalAlpha=alpha*.3;ctx.fillStyle='#00e5ff';ctx.shadowBlur=50;ctx.shadowColor='#00e5ff';
    ctx.fillRect(bx-16,0,bw+32,G.sqY);
    // Mid
    ctx.globalAlpha=alpha*.55;ctx.fillStyle='#80ffff';ctx.shadowBlur=20;ctx.shadowColor='#80ffff';
    ctx.fillRect(bx,0,bw,G.sqY);
    // Core
    ctx.globalAlpha=alpha*.95;ctx.fillStyle='#ffffff';ctx.shadowBlur=0;
    const cw=Math.max(4,bw*.25);ctx.fillRect(beam.cx-cw/2,0,cw,G.sqY);
    ctx.restore();
  });
}

function drawParticles(){
  G.particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life/p.maxLife;
    if(p.isT){
      ctx.fillStyle=p.col;ctx.font=`900 ${p.sz}px Arial Black`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowBlur=8;ctx.shadowColor='rgba(0,0,0,.6)';ctx.fillText(p.text,p.x,p.y);
    }else{
      ctx.fillStyle=p.col;
      if(p.flame){ctx.shadowBlur=8;ctx.shadowColor=p.col;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;ctx.restore();
  });
}

// Lv5 ambient aura around player
function drawLv5Aura(){
  if(G.wLv!==5)return;
  const t=Date.now();
  const colMap={gun:'#ffd700',laser:'#00e5ff',flame:'#ff4500'};
  const c=colMap[G.wType];
  ctx.save();ctx.globalAlpha=.12+Math.sin(t*.009)*.07;
  const grd=ctx.createRadialGradient(G.sqX,G.sqY,0,G.sqX,G.sqY,90);
  grd.addColorStop(0,c);grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(G.sqX,G.sqY,90,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── END ────────────────────────────────────────────────────────────────
function showEnd(win){
  document.getElementById('wbtns').style.display='none';
  document.getElementById('overlay').innerHTML=win
    ?`<h1>🏆 全Wave クリア！</h1><div class="sub">完全勝利！伝説の英雄！</div><div id="score-final">最終スコア: ${G.score}</div><button id="start-btn">もう一度！</button>`
    :`<h1>💀 ゲームオーバー</h1><div class="sub">兵士が全滅…また挑戦！</div><div id="score-final">スコア: ${G.score}</div><button id="start-btn">もう一度！</button>`;
  document.getElementById('overlay').style.display='flex';
  document.getElementById('start-btn').addEventListener('click',startGame);
}

let rafId=null;
function loop(){update();draw();
  if(G.state==='gameover'){showEnd(false);return;}
  if(G.state==='win'){showEnd(true);return;}
  rafId=requestAnimationFrame(loop);
}
function startGame(){
  if(rafId)cancelAnimationFrame(rafId);
  document.getElementById('overlay').style.display='none';
  document.getElementById('wbtns').style.display='flex';
  resize();newGame();rafId=requestAnimationFrame(loop);
}
document.getElementById('start-btn').addEventListener('click',startGame);
resize();
</script>
</body>
